name: Film kit checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
        working-directory: connectors
      - run: npm run typecheck
      - run: python tools/test-package-source.py
      - run: python tools/package-source.py --check
      - run: npm test
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile -t film-kit .
      - run: docker run --rm film-kit npm run doctor
      - run: docker run --rm film-kit npm run preview -- template --frames 0-23
