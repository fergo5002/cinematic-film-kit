name: Film kit checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # Homebrew's plain ffmpeg has no drawtext; ffmpeg-full does, and is keg-only.
      - if: runner.os == 'macOS'
        run: |
          brew install ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
        working-directory: connectors
      - run: npm run typecheck
      - run: python3 tools/test-package-source.py
      - run: python3 tools/package-source.py --check
      - run: npm test
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile -t film-kit .
      - run: docker run --rm film-kit npm run doctor
      - run: docker run --rm film-kit npm run preview -- template --frames 0-23
      # the narrated example, from its shipped voice: the narration packages are not in the image
      - run: docker run --rm film-kit npm run preview -- neap --frames 120-143
